[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rp2040-macropad"
version = "0.1.0"
description = "Firmware and deployment tool for 15-Key RP2040 Gamepad Controller with Rotary Encoder and Analog Axis"
readme = "README.md"
authors = [
    { name = "Custom Tech", email = "info@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "adafruit-circuitpython-hid>=5.3.0",
]

[project.scripts]
macropad-deploy = "macropad.cli:main"

[project.urls]
Homepage = "https://github.com/example/rp2040-macropad"
